<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
    <link rel="stylesheet" href="/styles.css">
    <!--<link rel="manifest" href="/manifest.json">-->

</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='students/students.html'">
            <img src="/assets/logo.png" alt="Logo">
        </div>

        <div class="user-info">
                  <button id="login-btn" data-auth="guest">Log In</button>

            <div class="notifications" >
                <div class="bell" id="notification-bell" data-auth="user" onclick="openMessages()">
                    <span class="bell-icon">&#128276;</span>
                    <div class="new-messages-indicator" id="new-messages-indicator"></div>
                </div>
                <div class="message-preview" id="message-preview">
                    <ul>
                        <li>
                            <div class="message-item">
                                <img src="/assets/avatar.png" alt="Avatar">
                                <div class="message-content">
                                    <span class="sender-name">Student A</span>
                                    <span class="message-text">Sample Message...</span>
                                </div>
                            </div>
                        </li>
                        <li>
                            <div class="message-item">
                                <img src="/assets/avatar.png" alt="Avatar">
                                <div class="message-content">
                                    <span class="sender-name">Student B</span>
                                    <span class="message-text">Sample Message...</span>
                                </div>
                            </div>
                        </li>
                        <li>
                            <div class="message-item">
                                <img src="../assets/avatar.png" alt="Avatar">
                                <div class="message-content">
                                    <span class="sender-name">Student C</span>
                                    <span class="message-text">Sample Message...</span>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="user-profile" data-auth="user">
                <div class="profile-icon">
                    <img src="/assets/user-avatar.png" alt="User Avatar">
                    <span class="user-name">Kuhivchak Sofiia</span>
                </div>
                <div class="profile-tooltip">
                    <ul>
                        <li>
                            <button id="profile-btn">Profile</button>
                        </li>
                        <li>
                            <button id="logout-btn">Log Out</button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
            <button data-auth="user" class="burger-menu" id="burger-menu" onclick="toggleSidebar()">&#9776;</button>
            <div data-auth="user" class="sidebar">
                <nav>
                    <ul>
                        <li><a href="/dashboard/dashboard.html" data-auth="user">Dashboard</a></li>
                        <li><a href="/students/students.html" data-auth="user">Students</a></li>
                        <li><a href="/tasks/tasks.html" data-auth="user">Tasks</a></li>
                    </ul>
                </nav>
        </div>



        <div class="content">
            <main>

                <h1>Welcome!</h1>

            </main>
        </div>
    </div>

  <div id="login-modal" class="modal">
  <div class="modal-content">
    <button class="close-btn" id="login-cancel">&times;</button>
    <h2>Log In</h2>
    <form id="login-form">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <div class="btn-group">
        <button type="button" class="cancel-btn" id="login-cancel-btn">Cancel</button>
        <button type="submit" class="submit-btn">Log In</button>
      </div>
    </form>
  </div>
</div>
            <script type="module" src="script.js"defer ></script>
</body>
</html>
